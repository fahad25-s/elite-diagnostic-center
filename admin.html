<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডাক্তার কলিং প্যানেল - এলিট ডায়াগনস্টিক</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .admin-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            color: #111;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
        }
        hr {
            border: 0;
            border-top: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 10px;
            color: #222;
        }
        select {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            color: #0284c7;
            font-weight: 600;
            margin-bottom: 20px;
            outline: none;
        }
        .display-box {
            background-color: #f1f5f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .display-box p {
            font-size: 1.1rem;
            color: #475569;
            margin-bottom: 8px;
        }
        .display-box h2 {
            font-size: 3.5rem;
            color: #0284c7;
            font-weight: bold;
        }
        .btn-next {
            width: 100%;
            background-color: #16a34a;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 12px;
        }
        .btn-next:active {
            background-color: #15803d;
        }
        .btn-reset {
            width: 100%;
            background-color: #ef4444;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-reset:active {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>এলিট ডায়াগনস্টিক সেন্টার</h1>
        <p class="subtitle">ডাক্তার কলিং প্যানেল</p>
        <hr>

        <label for="doctorSelect">আপনার আইডি/নাম সিলেক্ট করুন:</label>
        <select id="doctorSelect" onchange="onDoctorChange()">
            <option value="doctor_1">ডাঃ সারওয়ার আহমদ জয়</option>
            <option value="doctor_2">ডাঃ সাদিয়া জান্নাত</option>
            <option value="doctor_3">ডাঃ আমিনা খাতুন</option>
            <option value="doctor_4">ডাঃ জুয়েল আহমেদ</option>
            <option value="doctor_5">ডাঃ নৌশিন ইসলাম চৌধুরী</option>
            <option value="doctor_6">ডাঃ ইসতেহাদ আবু জাফর চৌঃ</option>
            <option value="doctor_7">ডাঃ উমাইজা বিনতে অশোক</option>
        </select>

        <div class="display-box">
            <p>বর্তমান রুগীর নম্বর</p>
            <h2 id="calling-number">#000</h2>
        </div>

        <button class="btn-next" id="nextBtn" onclick="callNext()">NEXT (পরবর্তী রুগী)</button>
        <button class="btn-reset" onclick="resetDoctorQueue()">শুধুমাত্র এই ডাক্তারের টিকেট রিসেট করুন</button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCSAWE6NYMb1jeGpUoDA03Ak3ZqargJemo",
          authDomain: "elite-diagnostic-abf78.firebaseapp.com",
          databaseURL: "https://elite-diagnostic-abf78-default-rtdb.firebaseio.com",
          projectId: "elite-diagnostic-abf78",
          storageBucket: "elite-diagnostic-abf78.firebasestorage.app",
          messagingSenderId: "631961470012",
          appId: "1:631961470012:web:7cdd1ed8e39455b15d2f39"
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        let currentDoctorRef = null;

        // পেজ লোড হলে সেভ থাকা ডাক্তার নির্বাচন করবে
        window.onload = function() {
            const savedDoctor = localStorage.getItem('selected_doctor');
            const doctorSelect = document.getElementById('doctorSelect');
            if (savedDoctor && doctorSelect.querySelector(`option[value="${savedDoctor}"]`)) {
                doctorSelect.value = savedDoctor;
            }
            listenDoctorData();
        };

        // ড্রপডাউন চেঞ্জ করলে লোকাল স্টোরেজে সেভ থাকবে
        function onDoctorChange() {
            const doctorSelect = document.getElementById('doctorSelect');
            localStorage.setItem('selected_doctor', doctorSelect.value);
            listenDoctorData();
        }

        // বর্তমান ডাক্তারের ডাটা সিঙ্ক
        function listenDoctorData() {
            const doctorKey = document.getElementById('doctorSelect').value;

            if (currentDoctorRef) {
                currentDoctorRef.off(); // আগের ডাক্তারের সিঙ্ক বন্ধ করা
            }

            currentDoctorRef = db.ref(`queue/${doctorKey}/current_calling`);
            currentDoctorRef.on('value', (snapshot) => {
                const callingVal = snapshot.val() || 0;
                document.getElementById('calling-number').innerText = '#' + String(callingVal).padStart(3, '0');
            });
        }

        // NEXT বাটন প্রেস লজিক (ইস্যুকৃত টিকেটের চেয়ে বেশি যাবে না)
        function callNext() {
            const doctorSelect = document.getElementById('doctorSelect');
            const doctorKey = doctorSelect.value;
            const doctorName = doctorSelect.options[doctorSelect.selectedIndex].text;

            const docRef = db.ref(`queue/${doctorKey}`);

            docRef.once('value', (snapshot) => {
                const data = snapshot.val() || {};
                const totalIssued = data.total_issued || 0;
                const currentCalling = data.current_calling || 0;

                if (currentCalling >= totalIssued) {
                    alert(`এই ডাক্তারের আর কোনো নতুন টিকেট ইস্যু করা হয়নি!\n(সর্বমোট টিকেট ইস্যু: ${totalIssued})`);
                    return;
                }

                const nextSerial = currentCalling + 1;

                // ১. ডাক্তারের নিজের বর্তমান নম্বর আপডেট
                docRef.child('current_calling').set(nextSerial);

                // ২. ডিসপ্লেতে ঘোষণার জন্য গ্লোবাল ডাটা আপডেট
                db.ref('queue/last_called').set({
                    doctorKey: doctorKey,
                    doctorName: doctorName,
                    serialNumber: nextSerial,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            });
        }

        // নির্দিষ্ট ডাক্তারের টিকেট রিসেট লজিক
        function resetDoctorQueue() {
            const doctorSelect = document.getElementById('doctorSelect');
            const doctorKey = doctorSelect.value;
            const doctorName = doctorSelect.options[doctorSelect.selectedIndex].text;

            const confirmReset = confirm(`আপনি কি নিশ্চিত যে "${doctorName}"-এর টিকেট কাউন্ট রিসেট করতে চান?`);
            if (confirmReset) {
                db.ref(`queue/${doctorKey}`).set({
                    name: doctorName,
                    total_issued: 0,
                    current_calling: 0
                }).then(() => {
                    alert(`${doctorName}-এর টিকেট সফলতা সহকারে রিসেট হয়েছে।`);
                }).catch((err) => {
                    alert("রিসেট করতে সমস্যা হয়েছে!");
                    console.error(err);
                });
            }
        }
    </script>
</body>
</html>

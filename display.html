<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েটিং রুম ডিসপ্লে - এলিট ডায়াগনস্টিক</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #00FF00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* অডিও আনলক নোটিফিকেশন বার */
        #audioNotice {
            background: #ff9800;
            color: #000;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 6px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        header h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        header p {
            color: #aaaaaa;
            font-size: 1.1rem;
        }

        .live-clock {
            color: #00FF00;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 5px;
        }

        /* =====================================================
           RECENT CALLS - উপরের বড় বক্স
           ===================================================== */

        .announcement-banner {
            border: 2px solid #00FF00;
            border-radius: 12px;
            padding: 15px 20px 20px 20px;
            text-align: center;
            margin-bottom: 30px;
            background-color: #051505;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .announcement-banner h3 {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .recent-calls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }

        .recent-call {
            background-color: #111111;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 12px 10px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* সর্বশেষ কল Highlight */
        .recent-call.latest {
            border-color: #00FF00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            background-color: #081908;
            animation: pulse-border 1.5s infinite alternate;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 8px rgba(0, 255, 0, 0.4); }
            100% { box-shadow: 0 0 20px rgba(0, 255, 0, 0.8); }
        }

        .recent-call .doc-name {
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .recent-call .serial-no {
            color: #00FF00;
            font-size: 3.2rem;
            line-height: 1;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(0, 255, 0, 0.6);
        }

        /* =====================================================
           সকল ডাক্তারের গ্রিড
           ===================================================== */

        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .doctor-card {
            background-color: #111111;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .doctor-card.active {
            border-color: #00FF00;
            background-color: #081908;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
            transform: scale(1.02);
        }

        .doctor-card h4 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 10px;
            min-height: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .doctor-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00FF00;
        }

        /* =====================================================
           MOBILE / SMALL SCREEN
           ===================================================== */

        @media (max-width: 900px) {
            body { padding: 10px; }
            header h1 { font-size: 1.5rem; }
            header p { font-size: 0.9rem; }
            .recent-calls { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .recent-call { padding: 8px 5px; min-height: 100px; }
            .recent-call .doc-name { font-size: 0.9rem; }
            .recent-call .serial-no { font-size: 2.3rem; }
            .doctors-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>

<body>

    <!-- অডিও অ্যাক্টিভ করার জন্য নোটিশ -->
    <div id="audioNotice" onclick="unlockAudio()">🔊 সাউন্ড চালু করতে স্ক্রিনের যেকোনো স্থানে চাপ দিন / ক্লিক করুন</div>

    <!-- HEADER -->
    <header>
        <h1>এলিট ডায়াগনস্টিক সেন্টার এন্ড ফিজিওথেরাপি</h1>
        <p>মার্ভেলাস টাওয়ার, ঢাকাদক্ষিণ রোড, গোলাপগঞ্জ, সিলেট।</p>
        <div class="live-clock" id="liveClock">--:--:--</div>
    </header>

    <!-- RECENT 3 CALLS -->
    <div class="announcement-banner">
        <h3>সর্বশেষ কল</h3>
        <div class="recent-calls" id="recentCalls">
            <!-- JavaScript এখানে ৩টি কল দেখাবে -->
        </div>
    </div>

    <!-- DOCTORS REALTIME STATUS -->
    <div class="doctors-grid" id="doctorsGrid"></div>

    <!-- FIREBASE LIBRARIES -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        /* =====================================================
           FIREBASE CONFIG
           ===================================================== */
        const firebaseConfig = {
            apiKey: "AIzaSyCSAWE6NYMb1jeGpUoDA03Ak3ZqargJemo",
            authDomain: "elite-diagnostic-abf78.firebaseapp.com",
            databaseURL: "https://elite-diagnostic-abf78-default-rtdb.firebaseio.com",
            projectId: "elite-diagnostic-abf78",
            storageBucket: "elite-diagnostic-abf78.firebasestorage.app",
            messagingSenderId: "631961470012",
            appId: "1:631961470012:web:7cdd1ed8e39455b15d2f39"
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();

        /* =====================================================
           DOCTORS LIST
           ===================================================== */
        const doctorsList = [
            { key: 'doctor_1', name: 'ডাঃ সারওয়ার আহমদ জয়' },
            { key: 'doctor_2', name: 'ডাঃ সাদিয়া জান্নাত' },
            { key: 'doctor_3', name: 'ডাঃ আমিনা খাতুন' },
            { key: 'doctor_4', name: 'ডাঃ জুয়েল আহমেদ' },
            { key: 'doctor_5', name: 'ডাঃ নৌশিন ইসলাম চৌধুরী' },
            { key: 'doctor_6', name: 'ডাঃ ইসতেহাদ আবু জাফর চৌঃ' },
            { key: 'doctor_7', name: 'ডাঃ উমাইজা বিনতে অশোক' }
        ];

        let recentCalls = [];
        let audioCtx = null;

        /* =====================================================
           ENGLISH TO BENGALI NUMBER CONVERTER
           ===================================================== */
        function toBengaliNumber(num) {
            const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return String(num).replace(/\d/g, digit => bengaliDigits[digit]);
        }

        /* =====================================================
           LIVE CLOCK
           ===================================================== */
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('bn-BD', { hour12: true });
            const clockElem = document.getElementById('liveClock');
            if (clockElem) clockElem.innerText = timeStr;
        }
        setInterval(updateClock, 1000);

        /* =====================================================
           AUDIO SYSTEM
           ===================================================== */
        function unlockAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;

                if (!audioCtx) {
                    audioCtx = new AudioContext();
                }

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const notice = document.getElementById('audioNotice');
                if (notice) notice.style.display = 'none';
            } catch (e) {
                console.error("Audio unlock error:", e);
            }
        }

        function playEchoDingDong() {
            try {
                if (!audioCtx) unlockAudio();
                if (!audioCtx || audioCtx.state === 'suspended') return;

                const now = audioCtx.currentTime;

                // First Note - Ding
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, now);
                gain1.gain.setValueAtTime(0.5, now);
                gain1.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 1.8);

                // Second Note - Dong
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(523.25, now + 0.5);
                gain2.gain.setValueAtTime(0.5, now + 0.5);
                gain2.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);

                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.5);
                osc2.stop(now + 3.0);
            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }

        /* =====================================================
           RENDER CARDS & RECENT CALLS
           ===================================================== */
        function renderCards() {
            const grid = document.getElementById('doctorsGrid');
            grid.innerHTML = '';

            doctorsList.forEach(doc => {
                const card = document.createElement('div');
                card.className = 'doctor-card';
                card.id = `card-${doc.key}`;
                card.innerHTML = `
                    <h4>${doc.name}</h4>
                    <div class="number" id="num-${doc.key}">#০০০</div>
                `;
                grid.appendChild(card);
            });
        }

        function renderRecentCalls() {
            const container = document.getElementById('recentCalls');
            container.innerHTML = '';

            if (recentCalls.length === 0) {
                for (let i = 0; i < 3; i++) {
                    container.innerHTML += `
                        <div class="recent-call">
                            <div class="doc-name">অপেক্ষমাণ</div>
                            <div class="serial-no">#০০০</div>
                        </div>
                    `;
                }
                return;
            }

            recentCalls.slice(0, 3).forEach((call, index) => {
                const card = document.createElement('div');
                card.className = 'recent-call';
                if (index === 0) card.classList.add('latest');

                const serialFormatted = toBengaliNumber(String(call.serialNumber).padStart(3, '0'));

                card.innerHTML = `
                    <div class="doc-name">${call.doctorName}</div>
                    <div class="serial-no">#${serialFormatted}</div>
                `;
                container.appendChild(card);
            });

            while (container.children.length < 3) {
                const emptyCard = document.createElement('div');
                emptyCard.className = 'recent-call';
                emptyCard.innerHTML = `
                    <div class="doc-name">অপেক্ষমাণ</div>
                    <div class="serial-no">#০০০</div>
                `;
                container.appendChild(emptyCard);
            }
        }

        function addRecentCall(data) {
            if (!data || !data.doctorName || !data.serialNumber) return;

            const newCall = {
                doctorKey: data.doctorKey,
                doctorName: data.doctorName,
                serialNumber: Number(data.serialNumber)
            };

            if (recentCalls.length > 0 &&
                recentCalls[0].doctorKey === newCall.doctorKey &&
                recentCalls[0].serialNumber === newCall.serialNumber) {
                return;
            }

            recentCalls.unshift(newCall);
            recentCalls = recentCalls.slice(0, 3);
            renderRecentCalls();
        }

        /* =====================================================
           INITIALIZE DISPLAY
           ===================================================== */
        function initDisplay() {
            renderCards();
            renderRecentCalls();
            updateClock();

            // Realtime Doctors Current Serial Listener
            doctorsList.forEach(doc => {
                db.ref(`queue/${doc.key}/current_calling`).on('value', (snapshot) => {
                    const val = snapshot.val() || 0;
                    const elem = document.getElementById(`num-${doc.key}`);
                    if (elem) {
                        const serialFormatted = toBengaliNumber(String(val).padStart(3, '0'));
                        elem.innerText = '#' + serialFormatted;
                    }
                });
            });

            // New Call Listener
            let initialLoad = true;

            db.ref('queue/last_called').on('value', (snapshot) => {
                const data = snapshot.val();

                if (data && data.doctorName && data.serialNumber) {
                    if (!initialLoad) {
                        playEchoDingDong();
                        addRecentCall(data);

                        // Highlight Active Doctor Card
                        document.querySelectorAll('.doctor-card').forEach(card => card.classList.remove('active'));
                        const activeCard = document.getElementById(`card-${data.doctorKey}`);
                        if (activeCard) {
                            activeCard.classList.add('active');
                        }
                    }
                    initialLoad = false;
                }
            });
        }

        /* =====================================================
           LISTENERS
           ===================================================== */
        document.addEventListener('click', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);

        window.onload = initDisplay;
    </script>
</body>
</html>

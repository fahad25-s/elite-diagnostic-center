<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েটিং রুম ডিসপ্লে - এলিট ডায়াগনস্টিক</title>
    <style>
        body {
            background-color: #000000;
            color: #00FF00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        h1.title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p.subtitle {
            font-size: 1.2rem;
            color: #aaaaaa;
            margin-bottom: 40px;
        }
        .label {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 10px;
        }
        #display-number {
            font-size: 10rem;
            font-weight: bold;
            color: #00FF00;
            margin: 0;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="title">এলিট ডায়াগনস্টিক সেন্টার এন্ড ফিজিওথেরাপি</h1>
        <p class="subtitle">মার্ভেলাস টাওয়ার, ঢাকাদক্ষিণ রোড, গোলাপগঞ্জ, সিলেট।</p>
        
        <div class="label">বর্তমান সিরিয়াল নম্বর</div>
        <h1 id="display-number">#000</h1>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCSAWE6NYMb1jeGpUoDA03Ak3ZqargJemo",
          authDomain: "elite-diagnostic-abf78.firebaseapp.com",
          databaseURL: "https://elite-diagnostic-abf78-default-rtdb.firebaseio.com",
          projectId: "elite-diagnostic-abf78",
          storageBucket: "elite-diagnostic-abf78.firebasestorage.app",
          messagingSenderId: "631961470012",
          appId: "1:631961470012:web:7cdd1ed8e39455b15d2f39"
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();

        db.ref('queue/current_calling').on('value', (snapshot) => {
            const callingSerial = snapshot.val();

            if (callingSerial && callingSerial > 0) {
                const numElem = document.getElementById('display-number');
                if (numElem) {
                    numElem.innerText = '#' + String(callingSerial).padStart(3, '0');
                }

                playEchoDingDong();
            }
        });

        // ৩.০ সেকেন্ডের লং ইকো ডিং-ডং সাউন্ড
        function playEchoDingDong() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioCtx();

                // 1st Note (Ding - E5)
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime);
                gain1.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(audioCtx.currentTime);
                osc1.stop(audioCtx.currentTime + 1.8);

                // 2nd Note (Dong - C5)
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.5);
                gain2.gain.setValueAtTime(0.5, audioCtx.currentTime + 0.5);
                gain2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.0);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(audioCtx.currentTime + 0.5);
                osc2.stop(audioCtx.currentTime + 3.0);

            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }
    </script>
</body>
</html>

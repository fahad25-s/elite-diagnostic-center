<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েটিং রুম ডিসপ্লে - এলিট ডায়াগনস্টিক</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #00FF00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 {
            color: #ffffff;
            font-size: 2.2rem;
        }
        header p {
            color: #aaaaaa;
            font-size: 1.1rem;
        }

        /* সর্বশেষ যাকে ডাকা হয়েছে তার হাইলাইট ব্যানার */
        .announcement-banner {
            border: 2px solid #00FF00;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
            background-color: #051505;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        .announcement-banner h3 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .announcement-banner .doc-name {
            font-size: 2.2rem;
            color: #ffffff;
            font-weight: bold;
        }
        .announcement-banner .serial-no {
            font-size: 5rem;
            color: #00FF00;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }

        /* সকল ডাক্তারের গ্রিড */
        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        .doctor-card {
            background-color: #111111;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .doctor-card.active {
            border-color: #00FF00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        .doctor-card h4 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 10px;
            min-height: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .doctor-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00FF00;
        }
    </style>
</head>
<body>

    <header>
        <h1>এলিট ডায়াগনস্টিক সেন্টার এন্ড ফিজিওথেরাপি</h1>
        <p>মার্ভেলাস টাওয়ার, ঢাকাদক্ষিণ রোড, গোলাপগঞ্জ, সিলেট।</p>
    </header>

    <!-- সর্বশেষ রুগীর ঘোষণা ব্যানার -->
    <div class="announcement-banner">
        <div class="doc-name" id="calledDoctor">ডাঃ অপেক্ষমাণ...</div>
        <div class="serial-no" id="calledSerial">#000</div>
    </div>

    <!-- ৭ জন ডাক্তারের রিয়েলটাইম স্ট্যাটাস -->
    <div class="doctors-grid" id="doctorsGrid"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCSAWE6NYMb1jeGpUoDA03Ak3ZqargJemo",
          authDomain: "elite-diagnostic-abf78.firebaseapp.com",
          databaseURL: "https://elite-diagnostic-abf78-default-rtdb.firebaseio.com",
          projectId: "elite-diagnostic-abf78",
          storageBucket: "elite-diagnostic-abf78.firebasestorage.app",
          messagingSenderId: "631961470012",
          appId: "1:631961470012:web:7cdd1ed8e39455b15d2f39"
        };

        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();

        const doctorsList = [
            { key: 'doctor_1', name: 'ডাঃ সারওয়ার আহমদ জয়' },
            { key: 'doctor_2', name: 'ডাঃ সাদিয়া জান্নাত' },
            { key: 'doctor_3', name: 'ডাঃ আমিনা খাতুন' },
            { key: 'doctor_4', name: 'ডাঃ জুয়েল আহমেদ' },
            { key: 'doctor_5', name: 'ডাঃ নৌশিন ইসলাম চৌধুরী' },
            { key: 'doctor_6', name: 'ডাঃ ইসতেহাদ আবু জাফর চৌঃ' },
            { key: 'doctor_7', name: 'ডাঃ উমাইজা বিনতে অশোক' }
        ];

        // আপনার অরিজিনাল ৩.০ সেকেন্ডের ইকো ডিং-ডং সাউন্ড
        function playEchoDingDong() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioCtx();

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // 1st Note (Ding - E5)
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime);
                gain1.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(audioCtx.currentTime);
                osc1.stop(audioCtx.currentTime + 1.8);

                // 2nd Note (Dong - C5)
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.5);
                gain2.gain.setValueAtTime(0.5, audioCtx.currentTime + 0.5);
                gain2.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.0);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(audioCtx.currentTime + 0.5);
                osc2.stop(audioCtx.currentTime + 3.0);

            } catch (e) {
                console.error("Audio playback error:", e);
            }
        }

        function renderCards() {
            const grid = document.getElementById('doctorsGrid');
            grid.innerHTML = '';

            doctorsList.forEach(doc => {
                const card = document.createElement('div');
                card.className = 'doctor-card';
                card.id = `card-${doc.key}`;
                card.innerHTML = `
                    <h4>${doc.name}</h4>
                    <div class="number" id="num-${doc.key}">#000</div>
                `;
                grid.appendChild(card);
            });
        }

        function initDisplay() {
            renderCards();

            // ৭ জন ডাক্তারের নম্বর সিঙ্ক
            doctorsList.forEach(doc => {
                db.ref(`queue/${doc.key}/current_calling`).on('value', (snapshot) => {
                    const val = snapshot.val() || 0;
                    const elem = document.getElementById(`num-${doc.key}`);
                    if (elem) elem.innerText = '#' + String(val).padStart(3, '0');
                });
            });

            // কল হওয়া মাত্রই ব্যানারে আপডেট এবং আপনার প্রিয় ডিং-ডং সাউন্ড প্লে
            let initialLoad = true;
            db.ref('queue/last_called').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.doctorName && data.serialNumber) {
                    document.getElementById('calledDoctor').innerText = data.doctorName;
                    document.getElementById('calledSerial').innerText = '#' + String(data.serialNumber).padStart(3, '0');

                    if (!initialLoad) {
                        playEchoDingDong();

                        document.querySelectorAll('.doctor-card').forEach(c => c.classList.remove('active'));
                        const activeCard = document.getElementById(`card-${data.doctorKey}`);
                        if (activeCard) activeCard.classList.add('active');
                    }
                    initialLoad = false;
                }
            });
        }

        // স্ক্রিনে যেকোনো জায়গায় ক্লিক করলে অডিও অটো-প্লে পারমিশন চালু থাকবে
        document.body.addEventListener('click', function() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const dummyCtx = new AudioCtx();
            if (dummyCtx.state === 'suspended') {
                dummyCtx.resume();
            }
        });

        window.onload = initDisplay;
    </script>
</body>
</html>

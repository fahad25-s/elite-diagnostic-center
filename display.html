<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েটিং রুম ডিসপ্লে - এলিট ডায়াগনস্টিক</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #00FF00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #ffffff;
            font-size: 2.2rem;
        }

        header p {
            color: #aaaaaa;
            font-size: 1.1rem;
        }


        /* =====================================================
           RECENT CALLS - উপরের বড় বক্স
           ===================================================== */

        .announcement-banner {
            border: 2px solid #00FF00;
            border-radius: 12px;
            padding: 15px 20px 20px 20px;
            text-align: center;
            margin-bottom: 30px;
            background-color: #051505;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .announcement-banner h3 {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 12px;
        }


        /* ৩টি Recent Call পাশাপাশি */

        .recent-calls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
        }


        .recent-call {
            background-color: #111111;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 12px 10px;
            min-height: 120px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }


        /* সর্বশেষ কলটি একটু Highlight হবে */

        .recent-call.latest {
            border-color: #00FF00;
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.35);
            background-color: #081908;
        }


        .recent-call .doc-name {
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: bold;
            margin-bottom: 5px;
        }


        .recent-call .serial-no {
            color: #00FF00;
            font-size: 3.2rem;
            line-height: 1;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(0, 255, 0, 0.6);
        }


        /* =====================================================
           সকল ডাক্তারের গ্রিড
           ===================================================== */

        .doctors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .doctor-card {
            background-color: #111111;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .doctor-card.active {
            border-color: #00FF00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .doctor-card h4 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 10px;
            min-height: 2.5em;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .doctor-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00FF00;
        }


        /* =====================================================
           MOBILE / SMALL SCREEN
           ===================================================== */

        @media (max-width: 900px) {

            body {
                padding: 10px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            header p {
                font-size: 0.9rem;
            }

            .recent-calls {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .recent-call {
                padding: 8px 5px;
                min-height: 100px;
            }

            .recent-call .doc-name {
                font-size: 0.9rem;
            }

            .recent-call .serial-no {
                font-size: 2.3rem;
            }

            .doctors-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header>

        <h1>
            এলিট ডায়াগনস্টিক সেন্টার এন্ড ফিজিওথেরাপি
        </h1>

        <p>
            মার্ভেলাস টাওয়ার, ঢাকাদক্ষিণ রোড, গোলাপগঞ্জ, সিলেট।
        </p>

    </header>


    <!-- =====================================================
         RECENT 3 CALLS
         ===================================================== -->

    <div class="announcement-banner">

        <h3>
            সর্বশেষ কল
        </h3>

        <div
            class="recent-calls"
            id="recentCalls">

            <!-- JavaScript এখানে ৩টি কল দেখাবে -->

        </div>

    </div>


    <!-- =====================================================
         ৭ জন ডাক্তারের REALTIME STATUS
         ===================================================== -->

    <div
        class="doctors-grid"
        id="doctorsGrid">
    </div>


    <!-- =====================================================
         FIREBASE
         ===================================================== -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


    <script>


        /* =====================================================
           FIREBASE CONFIG
           ===================================================== */

        const firebaseConfig = {

            apiKey: "AIzaSyCSAWE6NYMb1jeGpUoDA03Ak3ZqargJemo",

            authDomain:
                "elite-diagnostic-abf78.firebaseapp.com",

            databaseURL:
                "https://elite-diagnostic-abf78-default-rtdb.firebaseio.com",

            projectId:
                "elite-diagnostic-abf78",

            storageBucket:
                "elite-diagnostic-abf78.firebasestorage.app",

            messagingSenderId:
                "631961470012",

            appId:
                "1:631961470012:web:7cdd1ed8e39455b15d2f39"

        };


        if (
            typeof firebase !== 'undefined' &&
            !firebase.apps.length
        ) {

            firebase.initializeApp(firebaseConfig);

        }


        const db = firebase.database();


        /* =====================================================
           DOCTORS
           ===================================================== */

        const doctorsList = [

            {
                key: 'doctor_1',
                name: 'ডাঃ সারওয়ার আহমদ জয়'
            },

            {
                key: 'doctor_2',
                name: 'ডাঃ সাদিয়া জান্নাত'
            },

            {
                key: 'doctor_3',
                name: 'ডাঃ আমিনা খাতুন'
            },

            {
                key: 'doctor_4',
                name: 'ডাঃ জুয়েল আহমেদ'
            },

            {
                key: 'doctor_5',
                name: 'ডাঃ নৌশিন ইসলাম চৌধুরী'
            },

            {
                key: 'doctor_6',
                name: 'ডাঃ ইসতেহাদ আবু জাফর চৌঃ'
            },

            {
                key: 'doctor_7',
                name: 'ডাঃ উমাইজা বিনতে অশোক'
            }

        ];


        /* =====================================================
           RECENT CALLS
           সর্বশেষ ৩টি
           ===================================================== */

        let recentCalls = [];


        /* =====================================================
           AUDIO SYSTEM
           ===================================================== */

        let audioCtx = null;


        /*
         * Browser audio unlock
         */

        function unlockAudio() {

            try {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;


                if (!AudioContext) {
                    return;
                }


                if (!audioCtx) {

                    audioCtx =
                        new AudioContext();

                }


                if (
                    audioCtx.state === 'suspended'
                ) {

                    audioCtx.resume();

                }

            } catch (e) {

                console.error(
                    "Audio unlock error:",
                    e
                );

            }

        }


        /*
         * Ding-Dong sound
         */

        function playEchoDingDong() {

            try {

                if (!audioCtx) {
                    unlockAudio();
                }


                if (!audioCtx) {
                    return;
                }


                if (
                    audioCtx.state === 'suspended'
                ) {

                    audioCtx.resume();

                }


                const now =
                    audioCtx.currentTime;


                /* =============================================
                   FIRST NOTE - DING
                   ============================================= */

                const osc1 =
                    audioCtx.createOscillator();

                const gain1 =
                    audioCtx.createGain();


                osc1.type = 'sine';


                osc1.frequency.setValueAtTime(
                    659.25,
                    now
                );


                gain1.gain.setValueAtTime(
                    0.5,
                    now
                );


                gain1.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + 1.8
                );


                osc1.connect(gain1);

                gain1.connect(
                    audioCtx.destination
                );


                osc1.start(now);

                osc1.stop(
                    now + 1.8
                );


                /* =============================================
                   SECOND NOTE - DONG
                   ============================================= */

                const osc2 =
                    audioCtx.createOscillator();

                const gain2 =
                    audioCtx.createGain();


                osc2.type = 'sine';


                osc2.frequency.setValueAtTime(
                    523.25,
                    now + 0.5
                );


                gain2.gain.setValueAtTime(
                    0.5,
                    now + 0.5
                );


                gain2.gain.exponentialRampToValueAtTime(
                    0.0001,
                    now + 3.0
                );


                osc2.connect(gain2);

                gain2.connect(
                    audioCtx.destination
                );


                osc2.start(
                    now + 0.5
                );

                osc2.stop(
                    now + 3.0
                );


            } catch (e) {

                console.error(
                    "Audio playback error:",
                    e
                );

            }

        }


        /* =====================================================
           DOCTOR CARDS
           ===================================================== */

        function renderCards() {

            const grid =
                document.getElementById(
                    'doctorsGrid'
                );


            grid.innerHTML = '';


            doctorsList.forEach(doc => {

                const card =
                    document.createElement(
                        'div'
                    );


                card.className =
                    'doctor-card';


                card.id =
                    `card-${doc.key}`;


                card.innerHTML = `

                    <h4>
                        ${doc.name}
                    </h4>

                    <div
                        class="number"
                        id="num-${doc.key}">
                        #000
                    </div>

                `;


                grid.appendChild(card);

            });

        }


        /* =====================================================
           RECENT CALLS DISPLAY
           ===================================================== */

        function renderRecentCalls() {

            const container =
                document.getElementById(
                    'recentCalls'
                );


            container.innerHTML = '';


            /*
             * এখনো কোনো কল না হলে
             */

            if (
                recentCalls.length === 0
            ) {

                container.innerHTML = `

                    <div class="recent-call">

                        <div class="doc-name">
                            অপেক্ষমাণ
                        </div>

                        <div class="serial-no">
                            #000
                        </div>

                    </div>

                    <div class="recent-call">

                        <div class="doc-name">
                            অপেক্ষমাণ
                        </div>

                        <div class="serial-no">
                            #000
                        </div>

                    </div>

                    <div class="recent-call">

                        <div class="doc-name">
                            অপেক্ষমাণ
                        </div>

                        <div class="serial-no">
                            #000
                        </div>

                    </div>

                `;

                return;

            }


            /*
             * সর্বশেষ ৩টি কল
             */

            recentCalls
                .slice(0, 3)
                .forEach(
                    (call, index) => {

                        const card =
                            document.createElement(
                                'div'
                            );


                        card.className =
                            'recent-call';


                        /*
                         * সর্বশেষ কল Highlight
                         */

                        if (index === 0) {

                            card.classList.add(
                                'latest'
                            );

                        }


                        card.innerHTML = `

                            <div class="doc-name">
                                ${call.doctorName}
                            </div>

                            <div class="serial-no">
                                #${String(
                                    call.serialNumber
                                ).padStart(3, '0')}
                            </div>

                        `;


                        container.appendChild(
                            card
                        );

                    }
                );


            /*
             * যদি ৩টির কম Call থাকে,
             * তাহলে খালি Box পূরণ করবে
             */

            while (
                container.children.length < 3
            ) {

                const emptyCard =
                    document.createElement(
                        'div'
                    );


                emptyCard.className =
                    'recent-call';


                emptyCard.innerHTML = `

                    <div class="doc-name">
                        অপেক্ষমাণ
                    </div>

                    <div class="serial-no">
                        #000
                    </div>

                `;


                container.appendChild(
                    emptyCard
                );

            }

        }


        /* =====================================================
           ADD NEW RECENT CALL
           ===================================================== */

        function addRecentCall(data) {

            if (
                !data ||
                !data.doctorName ||
                !data.serialNumber
            ) {

                return;

            }


            const newCall = {

                doctorKey:
                    data.doctorKey,

                doctorName:
                    data.doctorName,

                serialNumber:
                    Number(
                        data.serialNumber
                    )

            };


            /*
             * একই Call duplicate হওয়া বন্ধ
             */

            if (
                recentCalls.length > 0 &&
                recentCalls[0].doctorKey ===
                    newCall.doctorKey &&
                recentCalls[0].serialNumber ===
                    newCall.serialNumber
            ) {

                return;

            }


            /*
             * নতুন Call সবার আগে
             */

            recentCalls.unshift(
                newCall
            );


            /*
             * শুধু সর্বশেষ ৩টি রাখবে
             */

            recentCalls =
                recentCalls.slice(0, 3);


            renderRecentCalls();

        }


        /* =====================================================
           INITIALIZE DISPLAY
           ===================================================== */

        function initDisplay() {

            renderCards();

            renderRecentCalls();


            /* -----------------------------------------------
               প্রত্যেক ডাক্তারের Current Serial
               ----------------------------------------------- */

            doctorsList.forEach(doc => {

                db.ref(
                    `queue/${doc.key}/current_calling`
                ).on(
                    'value',
                    (snapshot) => {

                        const val =
                            snapshot.val() || 0;


                        const elem =
                            document.getElementById(
                                `num-${doc.key}`
                            );


                        if (elem) {

                            elem.innerText =
                                '#' +
                                String(
                                    val
                                ).padStart(
                                    3,
                                    '0'
                                );

                        }

                    }
                );

            });


            /* -----------------------------------------------
               NEW CALL LISTENER
               ----------------------------------------------- */

            let initialLoad = true;


            db.ref(
                'queue/last_called'
            ).on(
                'value',
                (snapshot) => {

                    const data =
                        snapshot.val();


                    if (
                        data &&
                        data.doctorName &&
                        data.serialNumber
                    ) {


                        /*
                         * প্রথমবার page load হলে
                         * Recent Calls-এ যোগ করবে না
                         * এবং sound হবে না।
                         */

                        if (!initialLoad) {


                            /* ===========================
                               SOUND
                               =========================== */

                            playEchoDingDong();


                            /* ===========================
                               RECENT CALL
                               =========================== */

                            addRecentCall(
                                data
                            );


                            /* ===========================
                               ACTIVE DOCTOR
                               =========================== */

                            document
                                .querySelectorAll(
                                    '.doctor-card'
                                )
                                .forEach(
                                    card => {

                                        card.classList.remove(
                                            'active'
                                        );

                                    }
                                );


                            const activeCard =
                                document.getElementById(
                                    `card-${data.doctorKey}`
                                );


                            if (
                                activeCard
                            ) {

                                activeCard.classList.add(
                                    'active'
                                );

                            }

                        }


                        initialLoad = false;

                    }

                }
            );

        }


        /* =====================================================
           USER INTERACTION
           AUDIO UNLOCK
           ===================================================== */

        document.addEventListener(
            'click',
            unlockAudio
        );

        document.addEventListener(
            'touchstart',
            unlockAudio
        );


        /* =====================================================
           START
           ===================================================== */

        window.onload =
            initDisplay;


    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টিকেট কিয়োস্ক - এলিট ডায়াগনস্টিক</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="kiosk-container" style="max-width: 400px; margin: 50px auto; text-align: center; font-family: sans-serif;">
        <h2>এলিট ডায়াগনস্টিক সেন্টার</h2>
        <p>টিকেট সংগ্রহ করুন</p>
        
        <hr style="margin: 20px 0;">

        <!-- ডাক্তার সিলেক্ট করার আপডেটেড ড্রপডাউন -->
        <div style="margin-bottom: 20px; text-align: left;">
            <label for="doctorSelect" style="font-weight: bold; display: block; margin-bottom: 5px;">ডাক্তার নির্বাচন করুন:</label>
            <select id="doctorSelect" style="width: 100%; padding: 10px; font-size: 1rem; border-radius: 5px; border: 1px solid #ccc;">
                <option value="doctor_1">ডাঃ সারওয়ার আহমদ জয়</option>
                <option value="doctor_2">ডাঃ সাদিয়া জান্নাত</option>
                <option value="doctor_3">ডাঃ আমিনা খাতুন</option>
                <option value="doctor_4">ডাঃ জুয়েল আহমেদ</option>
                <option value="doctor_5">ডাঃ নৌশিন ইসলাম চৌধুরী</option>
                <option value="doctor_6">ডাঃ ইসতেহাদ আবু জাফর চৌঃ</option>
                <option value="doctor_7">ডাঃ উমাইজা বিনতে অশোক</option>
            </select>
        </div>

        <button id="printBtn" style="padding: 12px 25px; font-size: 1.2rem; background-color: #0066cc; color: white; border: none; border-radius: 5px; cursor: pointer;">
            টিকেট নিন
        </button>

        <!-- প্রিন্ট এরিয়া (টিকেট রসিদ) -->
        <div id="printable-ticket" style="margin-top: 30px; border: 1px dashed #000; padding: 15px; display: inline-block; width: 100%; box-sizing: border-box;">
            <h3 style="margin: 5px 0;">এলিট ডায়াগনস্টিক সেন্টার</h3>
            <p id="ticket-doctor" style="font-weight: bold; margin: 5px 0;">-</p>
            <h1 id="ticket-number" style="font-size: 3rem; margin: 10px 0;">#000</h1>
            <p id="ticket-time" style="font-size: 0.85rem; color: #555; margin: 5px 0;">-</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টিকেট কিওস্ক - এলিট ডায়াগনস্টিক</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="kiosk-container">
        <h1>এলিট ডায়াগনস্টিক সেন্টার এন্ড ফিজিওথেরাপি</h1>
        <p>মার্ভেলাস টাওয়ার, ঢাকাদক্ষিণ রোড, গোলাপগঞ্জ, সিলেট।</p>
        <p>মোবাইলঃ- ০১৩৩৭-২৭৩০৮৩</p>
        <button id="printBtn">টিকেট নিন</button>
    </div>

    <div id="ticket-template" class="printable">
        <div class="header-section">
            <h2 class="brand-title">এলিট ডায়াগনস্টিক সেন্টার এন্ড ফিজিওথেরাপি</h2>
            <p class="address">মার্ভেলাস টাওয়ার, ঢাকাদক্ষিণ রোড, গোলাপগঞ্জ, সিলেট।</p>
            <p class="phone">মোবাইলঃ- ০১৩৩৭-২৭৩০৮৩</p>
        </div>

        <div class="serial-section">
            <p class="serial-label">সিরিয়াল নাম্বার</p>
            <h1 id="ticket-number">#000</h1>
        </div>

        <div class="footer-section">
            <p id="ticket-time" class="time-stamp"></p>
            <p class="thank-you">ধন্যবাদ, আমাদের সাথে থাকুন</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="script.js"></script>
</body>
</html>

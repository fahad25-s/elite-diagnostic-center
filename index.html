<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টিকেট কিওস্ক - এলিট ডায়াগনস্টিক</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="kiosk-container">
        <h1>এলিট ডায়াগনস্টিক সেন্টার এন্ড ফিজিওথেরাপি</h1>
        <p>মার্ভেলাস টাওয়ার, ঢাকাদক্ষিণ রোড, গোলাপগঞ্জ, সিলেট।</p>
        
        <hr style="margin: 20px 0; border: 0.5px solid #ccc;">

        <!-- ১. ডাক্তার সিলেক্ট করার ড্রপডাউন (যুক্ত করা হয়েছে) -->
        <div style="margin-bottom: 20px; text-align: left;">
            <label for="doctorSelect" style="font-weight: bold; display: block; margin-bottom: 8px;">ডাক্তার নির্বাচন করুন:</label>
            <select id="doctorSelect" style="width: 100%; padding: 12px; font-size: 1rem; border-radius: 6px; border: 1px solid #ccc;">
                <option value="doctor_1">ডাঃ সারওয়ার আহমদ জয়</option>
                <option value="doctor_2">ডাঃ সাদিয়া জান্নাত</option>
                <option value="doctor_3">ডাঃ আমিনা খাতুন</option>
                <option value="doctor_4">ডাঃ জুয়েল আহমেদ</option>
                <option value="doctor_5">ডাঃ নৌশিন ইসলাম চৌধুরী</option>
                <option value="doctor_6">ডাঃ ইসতেহাদ আবু জাফর চৌঃ</option>
                <option value="doctor_7">ডাঃ উমাইজা বিনতে অশোক</option>
            </select>
        </div>

        <button id="printBtn">টিকেট নিন</button>
    </div>

    <!-- থার্মাল প্রিন্ট ভিউ -->
    <div id="ticket-template" class="printable">
        <div class="header-section">
            <h2 class="brand-title">এলিট ডায়াগনস্টিক সেন্টার এন্ড ফিজিওথেরাপি</h2>
            <p class="address">মার্ভেলাস টাওয়ার, ঢাকাদক্ষিণ রোড, গোলাপগঞ্জ, সিলেট।</p>
        </div>

        <!-- ২. টিকেটে ডাক্তারের নাম প্রিন্ট হওয়ার এলিমেন্ট (যুক্ত করা হয়েছে) -->
        <div style="text-align: center; margin: 10px 0;">
            <p id="ticket-doctor" style="font-size: 1.1rem; font-weight: bold; margin: 5px 0;"></p>
        </div>

        <div class="serial-section">
            <p class="serial-label">সিরিয়াল নাম্বার</p>
            <h1 id="ticket-number">#000</h1>
        </div>

        <div class="footer-section">
            <p id="ticket-time" class="time-stamp"></p>
            <p class="thank-you">ধন্যবাদ, আমাদের সাথে থাকুন</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="script.js"></script>
</body>
</html>
